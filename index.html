<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord グループ退出ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #f0f8ff, #f9fbfc);
      color: #1e293b;
    }

    /* カードデザイン */
    .card {
      perspective: 1200px;
      border: 2px solid #7dd3fc;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(100, 200, 255, 0.25);
      border-radius: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: rotateY(8deg) rotateX(4deg);
      box-shadow: 0 12px 25px rgba(56, 189, 248, 0.45);
    }

    /* ボタンの光るエフェクト */
    .btn {
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(56, 189, 248, 0.4),
        transparent
      );
      transition: 0.5s;
    }
    .btn:hover::after {
      left: 100%;
    }
  </style>
</head>
<body class="flex justify-center items-center h-screen">

  <div class="card p-8 w-96">
    <h2 class="text-2xl font-bold mb-6 text-sky-700 text-center">グループ退出ツール</h2>
    <input id="token" type="password" placeholder="トークンを入力" class="w-full p-3 mb-3 rounded bg-gray-100 text-gray-800 border border-sky-200">
    <input id="groupName" type="text" placeholder="グループ名を入力 (!all ですべて)" class="w-full p-3 mb-5 rounded bg-gray-100 text-gray-800 border border-sky-200">
    
    <button onclick="startLeaving()" class="btn w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold p-3 rounded mb-4">🚀 実行</button>
    <button onclick="goHome()" class="btn w-full bg-teal-500 hover:bg-teal-400 text-white font-semibold p-3 rounded">🏠 ホームに戻る</button>
    
    <div id="log" class="mt-6 p-3 bg-gray-100 border border-sky-200 rounded h-44 overflow-auto text-sm text-gray-700"></div>
  </div>

  <script>
    async function getGroupDMs(token, groupName) {
      const response = await fetch('https://discord.com/api/v9/users/@me/channels', {
        headers: { 'Authorization': token, 'Content-Type': 'application/json' }
      });
      if (!response.ok) return [];
      const channels = await response.json();
      return groupName === '!all' ? channels.filter(ch => ch.type === 3) : channels.filter(ch => ch.type === 3 && ch.name && ch.name.includes(groupName));
    }

    async function leaveGroup(token, group) {
      await fetch(`https://discord.com/api/v9/channels/${group.id}`, {
        method: 'DELETE',
        headers: { 'Authorization': token }
      });
      logMessage(`退出: ${group.name}`);
    }

    async function startLeaving() {
      const token = document.getElementById('token').value;
      const groupName = document.getElementById('groupName').value;
      if (!token || !groupName) return logMessage('⚠️ トークンとグループ名を入力してください');
      logMessage('🔄 処理開始...');

      let counter = 0;
      while (true) {
        const groupDMs = await getGroupDMs(token, groupName);
        if (groupDMs.length === 0) {
          logMessage('🎉 すべてのグループDMから退出しました');
          break;
        }

        const tasks = groupDMs.slice(0, 5).map(group => leaveGroup(token, group));
        await Promise.all(tasks);
        counter += tasks.length;

        if (counter >= 40) {
          logMessage('⏸️ 40件完了 → 5秒休憩中...');
          await new Promise(r => setTimeout(r, 5000));
          counter = 0;
        }
      }
    }

    function logMessage(message) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<div>${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function goHome() {
      window.location.href = "https://smokeycode000.github.io/home/";
    }
  </script>
</body>
</html>
