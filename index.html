<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord グループ退出ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 flex justify-center items-center h-screen">
    <div class="bg-white p-6 rounded-2xl w-96 shadow-2xl border border-gray-200">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">グループ退出ツール</h2>
        <input id="token" type="password" placeholder="トークンを入力" 
            class="w-full p-2 mb-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400">
        <input id="groupName" type="text" placeholder="グループ名を入力 (!all ですべて)" 
            class="w-full p-2 mb-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400">
        <button onclick="startLeaving()" 
            class="w-full bg-blue-600 hover:bg-blue-500 p-2 rounded-lg text-white font-semibold shadow-md transition">実行</button>
        <button onclick="goHome()" 
            class="w-full bg-green-600 hover:bg-green-500 p-2 rounded-lg text-white font-semibold shadow-md transition mt-3">ホームに戻る</button>
        <div id="log" class="mt-4 p-2 bg-gray-100 rounded-lg h-40 overflow-auto text-sm border border-gray-300"></div>
    </div>

    <script>
        async function getGroupDMs(token, groupName) {
            const response = await fetch('https://discord.com/api/v9/users/@me/channels', {
                headers: { 'Authorization': token, 'Content-Type': 'application/json' }
            });
            if (!response.ok) return [];
            const channels = await response.json();
            return groupName === '!all' 
                ? channels.filter(ch => ch.type === 3) 
                : channels.filter(ch => ch.type === 3 && ch.name && ch.name.includes(groupName));
        }

        async function leaveGroup(token, group) {
            try {
                await fetch(`https://discord.com/api/v9/channels/${group.id}`, {
                    method: 'DELETE', headers: { 'Authorization': token }
                });
                logMessage(`✅ 退出: ${group.name}`);
            } catch {
                logMessage(`⚠️ 失敗: ${group.name}`);
            }
        }

        async function startLeaving() {
            const token = document.getElementById('token').value;
            const groupName = document.getElementById('groupName').value;
            if (!token || !groupName) return logMessage('⚠️ トークンとグループ名を入力してください');
            logMessage('🔄 処理開始...');

            while (true) {
                const groupDMs = await getGroupDMs(token, groupName);
                if (groupDMs.length === 0) {
                    logMessage('🎉 すべてのグループDMから退出しました');
                    break;
                }
                // 並列で実行（スピードアップ）
                await Promise.all(groupDMs.map(group => leaveGroup(token, group)));
                await new Promise(r => setTimeout(r, 1000)); // 1秒待機
            }
        }

        function logMessage(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function goHome() {
            window.location.href = "https://smokeycode000.github.io/home/";
        }
    </script>
</body>
</html>
