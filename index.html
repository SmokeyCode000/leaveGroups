<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord グループ退出ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-glow {
      transition: transform 0.15s ease, box-shadow 0.3s ease;
    }
    .btn-glow:active {
      transform: scale(0.97);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
    }
    .tilt-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      transform-style: preserve-3d;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex justify-center items-center min-h-screen">
  <div id="card"
    class="tilt-card bg-white p-10 rounded-3xl w-[420px] shadow-2xl border border-gray-200">
    <h2 class="text-3xl font-bold mb-8 text-center text-blue-600">グループ退出ツール</h2>

    <div class="space-y-5">
      <input id="token" type="password" placeholder="トークンを入力"
        class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400">

      <input id="groupName" type="text" placeholder="グループ名を入力 (!all ですべて)"
        class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400">

      <button onclick="startLeaving()"
        class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-white font-semibold shadow-md btn-glow">
        実行
      </button>

      <button onclick="goHome()"
        class="w-full bg-green-600 hover:bg-green-500 p-3 rounded-xl text-white font-semibold shadow-md btn-glow">
        ホームに戻る
      </button>
    </div>

    <div id="log"
      class="mt-8 p-3 bg-gray-50 rounded-xl h-48 overflow-auto text-sm border border-gray-300"></div>
  </div>

  <script>
    async function getGroupDMs(token, groupName) {
      const response = await fetch("https://discord.com/api/v9/users/@me/channels", {
        headers: { Authorization: token, "Content-Type": "application/json" },
      });
      if (!response.ok) return [];
      const channels = await response.json();
      return groupName === "!all"
        ? channels.filter((ch) => ch.type === 3)
        : channels.filter((ch) => ch.type === 3 && ch.name && ch.name.includes(groupName));
    }

    async function leaveGroup(token, group) {
      try {
        await fetch(`https://discord.com/api/v9/channels/${group.id}`, {
          method: "DELETE",
          headers: { Authorization: token },
        });
        logMessage(`✅ 退出: ${group.name}`);
      } catch {
        logMessage(`⚠️ 失敗: ${group.name}`);
      }
    }

    async function startLeaving() {
      const token = document.getElementById("token").value;
      const groupName = document.getElementById("groupName").value;
      if (!token || !groupName)
        return logMessage("⚠️ トークンとグループ名を入力してください");

      logMessage("🔄 処理開始...");

      const groups = await getGroupDMs(token, groupName);
      if (groups.length === 0) return logMessage("❌ 対象グループが見つかりません");

      const concurrency = 5; // 並列数
      let index = 0;
      let processed = 0;

      async function worker() {
        while (index < groups.length) {
          const group = groups[index++];
          await leaveGroup(token, group);
          processed++;

          // 50件ごとに5秒休憩
          if (processed % 50 === 0) {
            logMessage("⏸ 50件処理完了 → 5秒休憩中...");
            await new Promise((r) => setTimeout(r, 5000));
            logMessage("▶️ 再開");
          }
        }
      }

      await Promise.all(Array.from({ length: concurrency }, worker));

      logMessage("🎉 すべてのグループDMから退出しました");
    }

    function logMessage(message) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += `<div>${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function goHome() {
      window.location.href = "https://smokeycode000.github.io/home/";
    }

    // カードをカーソル方向にめくる動き
    const card = document.getElementById("card");
    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = ((y - centerY) / centerY) * -10; // 上下傾き
      const rotateY = ((x - centerX) / centerX) * 10;  // 左右傾き

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      card.style.boxShadow = `${-rotateY}px ${rotateX}px 20px rgba(0,0,0,0.2)`;
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
      card.style.boxShadow = "0 0 20px rgba(0,0,0,0.1)";
    });
  </script>
</body>
</html>
